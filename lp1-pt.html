<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Verificação de Idade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-align-items: center;
            align-items: center;
            padding: 60px 20px;
            background-color: #ffffff;
        }

        .content {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 40px;
            line-height: 1.2;
        }

        .timer-box {
            width: 200px;
            height: 80px;
            margin: 0 auto 50px;
            border: 3px dashed #ff6633;
            border-radius: 8px;
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
            background-color: #fafafa;
        }

        .timer {
            font-size: 42px;
            font-weight: 700;
            color: #1e88e5;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 16px;
            color: #666666;
            font-style: italic;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .button {
            width: 100%;
            padding: 16px;
            margin-bottom: 25px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            text-align: center;
        }

        .button-yes {
            background-color: #1e88e5;
            color: #ffffff;
        }

        .button-yes:active {
            background-color: #1565c0;
            transform: scale(0.98);
        }

        .button-yes:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .button-no {
            background-color: #64b5f6;
            color: #ffffff;
        }

        .button-no:active {
            background-color: #42a5f5;
            transform: scale(0.98);
        }

        .button-no:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading-text {
            font-size: 14px;
            color: #999;
            margin-top: 10px;
            min-height: 20px;
        }

        @media (max-width: 480px) {
            .title {
                font-size: 28px;
                margin-bottom: 40px;
            }

            .timer-box {
                width: 240px;
                height: 100px;
            }

            .timer {
                font-size: 48px;
            }

            .subtitle {
                font-size: 14px;
                margin-bottom: 30px;
            }

            .button {
                padding: 14px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <h1 class="title">Você tem 18 anos ou mais?</h1>
            
            <div class="timer-box">
                <div class="timer" id="timer">01:00</div>
            </div>

            <p class="subtitle">Você deve ter 18 anos ou mais para desbloquear sua oferta exclusiva</p>

            <button class="button button-yes" id="yesBtn" type="button">Sim</button>
            <button class="button button-no" id="noBtn" type="button">Não</button>
            
            <div class="loading-text" id="loadingText"></div>
        </div>
    </div>

    <script>
        // ========== 通用配置：改这个链接即可 ==========
        var OFFER_URL = 'https://sc.dailyrewardsh.com/click/1';
        // ===========================================

        (function() {
            var countdown = 60;
            var timerInterval = null;
            var yesBtn = document.getElementById('yesBtn');
            var noBtn = document.getElementById('noBtn');
            var timerDisplay = document.getElementById('timer');
            var loadingText = document.getElementById('loadingText');
            var noLocked = false;

            function formatTime(seconds) {
                var mins = Math.floor(seconds / 60);
                var secs = seconds % 60;
                return (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
            }

            function updateTimer() {
                timerDisplay.textContent = formatTime(countdown);

                if (countdown <= 0) {
                    clearInterval(timerInterval);
                }
                
                countdown = countdown - 1;
            }

            function startTimer() {
                updateTimer();
                timerInterval = setInterval(updateTimer, 1000);
            }

            function handleYesClick() {
                window.location.href = OFFER_URL;
            }

            function handleNoClick() {
                if (noLocked) return;
                noLocked = true;

                var remaining = 5;
                loadingText.textContent = 'Redirecionando em ' + remaining + ' segundos...';

                var redirectTimer = setInterval(function() {
                    remaining = remaining - 1;

                    if (remaining <= 0) {
                        clearInterval(redirectTimer);
                        window.location.href = 'https://www.google.com';
                    } else {
                        loadingText.textContent = 'Redirecionando em ' + remaining + ' segundos...';
                    }
                }, 1000);
            }

            yesBtn.addEventListener('click', handleYesClick);
            noBtn.addEventListener('click', handleNoClick);

            startTimer();
        })();
    </script>
</body>
</html>
