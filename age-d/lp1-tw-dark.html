<!DOCTYPE html>
<html lang="tw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Age Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #0F1B3A 0%, #1E3A5F 60%, #162A4A 100%);
        }
        .container {
            width: 100%; min-height: 100vh; min-height: 100dvh;
            display: -webkit-flex; display: flex;
            -webkit-flex-direction: column; flex-direction: column;
            -webkit-justify-content: center; justify-content: center;
            -webkit-align-items: center; align-items: center;
            padding: 60px 20px; background: linear-gradient(145deg, #0F1B3A 0%, #1E3A5F 60%, #162A4A 100%);
        }
        .content { width: 100%; max-width: 500px; text-align: center; }
        .title {
            font-size: 32px; font-weight: 700; color: #ffffff;
            margin-bottom: 40px; line-height: 1.2;
        }
        .timer-box {
            width: 160px; height: 64px; margin: 0 auto 40px;
            border: 2px dashed #E8B263; border-radius: 8px;
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            -webkit-justify-content: center; justify-content: center;
            background: transparent;
        }
        .timer {
            font-size: 38px; font-weight: 700; color: #FFB347; letter-spacing: 2px;
        }
        .subtitle {
            font-size: 16px; color: #999; font-style: italic;
            margin-bottom: 40px; line-height: 1.5;
        }
        .button {
            width: 100%; padding: 16px; margin-bottom: 25px;
            border: none; border-radius: 8px; font-size: 18px; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            -webkit-appearance: none; -moz-appearance: none; appearance: none;
            text-align: center;
        }
        .button-yes { background: linear-gradient(180deg, #FFB347 0%, #E8912E 100%); color: #ffffff; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 4px 16px rgba(255,179,71,0.25); }
        .button-yes:active { background: linear-gradient(180deg, #E8912E 0%, #D4851F 100%); transform: scale(0.97); box-shadow: 0 2px 8px rgba(255,179,71,0.15); }
        .button-yes:disabled { opacity: 0.6; cursor: not-allowed; }
        .button-no { background-color: transparent; color: #8a9a90; border: 1.5px solid #2a4a35; }
        .button-no:active { background-color: #1a2a20; transform: scale(0.98); }
        .button-no:disabled { opacity: 0.6; cursor: not-allowed; }
        .loading-text { font-size: 14px; color: #777; margin-top: 10px; min-height: 20px; }
        @media (max-width: 480px) {
            .title { font-size: 28px; margin-bottom: 40px; }
            .timer-box { width: 192px; height: 80px; }
            .timer { font-size: 44px; }
            .subtitle { font-size: 14px; margin-bottom: 30px; }
            .button { padding: 14px; font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <h1 class="title">Woadi mfe 18?</h1>
            <div class="timer-box">
                <div class="timer" id="timer">00:40</div>
            </div>
            <p class="subtitle">Ɛsɛ sɛ woadi mfe 18+ na woanya wo offer</p>
            <button class="button button-yes" id="yesBtn" type="button">Aane</button>
            <button class="button button-no" id="noBtn" type="button">Daabi</button>
            <div class="loading-text" id="loadingText"></div>
        </div>
    </div>
    <script>
        var OFFER_URL = 'https://sc.dailyrewardsh.com/click/1';
        (function() {
            var countdown = 40, timerInterval = null;
            var yesBtn = document.getElementById('yesBtn'), noBtn = document.getElementById('noBtn');
            var timerDisplay = document.getElementById('timer'), loadingText = document.getElementById('loadingText');
            var noLocked = false;
            function formatTime(s) { var m = Math.floor(s/60), r = s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
            function updateTimer() {
                timerDisplay.textContent = formatTime(countdown);
                if (countdown <= 0) clearInterval(timerInterval);
                countdown--;
            }
            function startTimer() { updateTimer(); timerInterval = setInterval(updateTimer, 1000); }
            function handleYesClick() { window.location.href = OFFER_URL; }
            function handleNoClick() {
                if (noLocked) return;
                noLocked = true;
                var remaining = 5;
                loadingText.textContent = 'Redirecting in ' + remaining + ' seconds...';
                var rt = setInterval(function() {
                    remaining--;
                    if (remaining <= 0) { clearInterval(rt); window.location.href = 'https://www.google.com'; }
                    else loadingText.textContent = 'Redirecting in ' + remaining + ' seconds...';
                }, 1000);
            }
            yesBtn.addEventListener('click', handleYesClick);
            noBtn.addEventListener('click', handleNoClick);
            startTimer();
        })();
    </script>
</body>
</html>
